<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Set it. Bend it. Order it. A pump impeller made to order, configured live on its own parametric model." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>impeller.parts</title>
    <style>
      /* (until the page has started: the paper, and the shop's red cube turning) */
      html, body { margin: 0; background: #fff; }
      .boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background-color: #fff; background-image: linear-gradient(rgba(15, 19, 32, 0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(15, 19, 32, 0.035) 1px, transparent 1px); background-size: 24px 24px; background-position: -1px -1px; }
      .boot i { width: 30px; height: 30px; border-radius: 5px; background: #e7000b; box-shadow: inset -7px -7px 0 rgba(0, 0, 0, 0.18); animation: boot 1.1s cubic-bezier(0.6, 0, 0.3, 1) infinite; }
      @keyframes boot { to { transform: rotate(180deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><i></i></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
